[capture]
; Visual cadence is measured in GAME seconds. At 3x, 15 game FPS may require
; up to 45 real captures/sec. Every missed interval is retained in frames.jsonl.
; JPEG is the research default: telemetry/input streams remain lossless, while
; the visual stream is small enough for longer collection. Use png for exact pixels.
enabled=1
visualFps=15
imageFormat=jpeg
jpegQuality=85
; 108000 frames = two hours at the default game-time cadence.
maxFrames=108000
