<!doctype html>
<!-- Real WebGL regression: fractional scrolling AND physical light coupling.
     ?quality=high also runs the check at the native high-resolution ratio. -->
<meta charset="utf-8">
<pre id="out">RUNNING</pre>
<div id="host" style="width:256px;height:256px"></div>
<script type="module">
import { GpuPlayfieldRenderer } from '../js/gpu-playfield.js';
const check = (ok, message) => { if (!ok) throw new Error(message); };
try {
  const quality = new URLSearchParams(location.search).get('quality') || 'low';
  const gpu = new GpuPlayfieldRenderer({ quality, adaptiveQuality: false });
  check(gpu.attach(document.querySelector('#host')), 'GPU attach');
  gpu.setLighting({ boardTexture: 0, bloom: 0, vignette: 0, bounce: 0 });
  const capture = (phase, style, filtered, pegs = [], hits = []) => {
    gpu.setLighting({ boardStyle: style });
    for (let i = 0; i < 3; i++) {
      check(gpu.render(pegs, hits, { width: 256, height: 256, cameraY: phase,
        gridCameraY: phase, smoothBoardGrid: filtered, bypassTemporalHistory: true }), 'Render');
    }
    const gl = gpu.gl, w = gpu.canvas.width, h = gpu.canvas.height;
    const pixels = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    check(gl.getError() === gl.NO_ERROR, 'WebGL error');
    return pixels;
  };
  const baseline = capture(0, 2, false);
  const w = gpu.canvas.width, h = gpu.canvas.height, ratio = w / 256;
  const index = (x, y) => ((h - 1 - Math.floor(y * ratio)) * w + Math.floor(x * ratio)) * 4;
  const phases = [0, .125, .25, .375, .5, .625, .75, .875, 1];
  const profile = filtered => phases.map(phase => {
    const pixels = capture(phase, 1, filtered);
    let mass = 0, moment = 0;
    for (let y = Math.ceil(137 * ratio); y < 152 * ratio; y++) {
      const i = ((h - 1 - y) * w + Math.floor(99.5 * ratio)) * 4;
      const contrast = Math.abs(.2126 * (pixels[i] - baseline[i])
        + .7152 * (pixels[i + 1] - baseline[i + 1])
        + .0722 * (pixels[i + 2] - baseline[i + 2]));
      mass += contrast;
      moment += contrast * (y + .5) / ratio;
    }
    return { phase, mass, center: moment / mass };
  });
  const old = profile(false), smooth = profile(true);
  const variation = rows => (Math.max(...rows.map(r => r.mass)) - Math.min(...rows.map(r => r.mass))) / rows[0].mass;
  const oldVariation = variation(old), newVariation = variation(smooth);
  check(newVariation < .12, `Groove still breathes in contrast: ${newVariation}`);
  if (quality === 'low') check(newVariation < oldVariation * .2, 'Raster-pair aliasing was not fixed');
  for (const row of smooth) {
    check(Math.abs(row.center - smooth[0].center + row.phase) < .15, 'Groove does not move smoothly');
  }

  // The grid must RECEIVE shadows and coloured light, not cover them with an
  // independently painted line. This intentionally requires a light response.
  const empty = capture(0, 1, true);
  const pegs = [{ id: 'p', type: 'blue', x: 104, y: 135 }];
  const quiet = capture(0, 1, true, pegs);
  const flash = capture(0, 1, true, pegs, ['p']);
  let shadow = 0, glow = 0;
  for (let y = 109; y < 116; y++) for (let x = 96; x < 122; x++) {
    const i = index(x, y);
    const sum = pixels => pixels[i] + pixels[i + 1] + pixels[i + 2];
    shadow = Math.max(shadow, sum(empty) - sum(quiet));
    glow = Math.max(glow, sum(flash) - sum(quiet));
  }
  check(shadow > 6, `Cast shadow missing from grid: ${shadow}`);
  check(glow > 10, `Peg light disconnected from grid: ${glow}`);
  gpu.setLighting({ exposure: 0 });
  const dark = capture(0, 1, true);
  let darkPeak = 0;
  for (let y = 30; y < 220; y++) for (let x = 30; x < 220; x++) {
    const i = index(x, y);
    darkPeak = Math.max(darkPeak, dark[i], dark[i + 1], dark[i + 2]);
  }
  check(darkPeak <= 1, 'Unlit grid is an overlay');
  document.querySelector('#out').textContent = 'PASS ' + JSON.stringify({ quality, ratio,
    oldVariation, newVariation, shadow, glow, darkPeak, smooth });
} catch (error) {
  document.querySelector('#out').textContent = 'FAIL ' + error.stack;
}
</script>
