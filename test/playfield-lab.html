<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Playfield lighting lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #07090d; color: #cfe6f2;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  body { display: flex; gap: 18px; align-items: flex-start; padding: 18px; }
  #stage { position: relative; width: 400px; height: 600px; flex: none; }
  #stage canvas { border-radius: 6px; }
  aside { display: flex; flex-direction: column; gap: 8px; max-width: 320px; }
  label { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  input[type=range] { width: 150px; }
  button { background: #14293a; color: #cfe6f2; border: 1px solid #2b556f;
    border-radius: 4px; padding: 5px 9px; cursor: pointer; font: inherit; }
  #err { color: #ff9b9b; white-space: pre-wrap; max-width: 320px; }
  h1 { font-size: 13px; margin: 0 0 6px; letter-spacing: .1em; text-transform: uppercase; }
</style>
</head>
<body>
<div id="stage"></div>
<aside>
  <h1>Playfield lighting lab</h1>
  <label>exposure <input id="exposure" type="range" min="0.2" max="3" step="0.05" value="1"></label>
  <label>bloom <input id="bloom" type="range" min="0" max="2" step="0.02" value="0.45"></label>
  <label>elevation <input id="elev" type="range" min="0.03" max="0.6" step="0.01" value="0.12"></label>
  <label>sky <input id="sky" type="range" min="0" max="3" step="0.05" value="1"></label>
  <label>bounce <input id="bounce" type="range" min="0" max="1.5" step="0.02" value="0.35"></label>
  <label>dome <input id="dome" type="range" min="0" max="5" step="0.05" value="1.35"></label>
  <label>key elev <input id="keyelev" type="range" min="0.2" max="2" step="0.02" value="0.62"></label>
  <label><span>animate</span> <input id="anim" type="checkbox" checked></label>
  <label><span>ball light</span> <input id="balllight" type="checkbox" checked></label>
  <button id="hit">flash random pegs</button>
  <button id="shot">fire ball</button>
  <div id="fps"></div>
  <div id="err"></div>
</aside>

<script type="module">
import { GpuPlayfieldRenderer } from '../js/gpu-playfield.js';
import { PHYSICS_CONFIG } from '../js/physics.js';

const params = new URLSearchParams(location.search);
// Display scale only — the logical playfield stays 400x600 like the game.
const SCALE = Math.max(1, Math.min(3, +params.get('scale') || 1));
const W = 400, H = 600;
const stage = document.getElementById('stage');
const err = document.getElementById('err');
stage.style.width = `${W * SCALE}px`;
stage.style.height = `${H * SCALE}px`;

// A layout in the spirit of reference 2: rings and lattices, mixed types.
const pegs = [];
let id = 0;
function peg(x, y, type, extra = {}) {
  pegs.push({ id: `p${id++}`, x, y, type, shape: 'circle', ...extra });
}

for (let row = 0; row < 6; row++) {
  const count = 5;
  for (let i = 0; i < count; i++) {
    const t = (i + (row % 2) * 0.5) / count;
    peg(40 + t * 320, 110 + row * 62, row % 3 === 1 ? 'blue' : 'orange');
  }
}
// central ring
for (let i = 0; i < 10; i++) {
  const a = (i / 10) * Math.PI * 2;
  peg(200 + Math.cos(a) * 34, 300 + Math.sin(a) * 34, 'orange');
}
peg(200, 300, 'bumper', { bumperScale: 1.6 });
peg(96, 214, 'bumper', { bumperScale: 1.25 });
peg(304, 214, 'bumper', { bumperScale: 1.25 });
peg(200, 470, 'purple');
peg(150, 500, 'green');
peg(250, 500, 'green');

// a couple of bricks to check the chamfer + thickness
pegs.push({ id: 'b0', x: 120, y: 400, type: 'obstacle', shape: 'brick', width: 74, height: 12, angle: -0.22 });
pegs.push({ id: 'b1', x: 280, y: 400, type: 'obstacle', shape: 'brick', width: 74, height: 12, angle: 0.22 });
pegs.push({ id: 'b2', x: 200, y: 168, type: 'blue', shape: 'brick', width: 96, height: 11, angle: 0 });

const renderer = new GpuPlayfieldRenderer();
if (!renderer.attach(stage)) err.textContent = 'WebGL2 init failed — see console';
renderer.resize(W, H);
// The game supplies CSS sizing via the renderer's layer layout; the lab does it here.
Object.assign(renderer.canvas.style, {
  position: 'absolute', inset: '0',
  width: `${W * SCALE}px`, height: `${H * SCALE}px`
});

const ball = { x: 200, y: 60, vx: 55, vy: 150, radius: PHYSICS_CONFIG.pegRadius * 0.95 };
let hits = new Set();

// ?hold=id,id — pin a flash on so the light spill can be inspected in a still.
const held = (params.get('hold') || '').split(',').filter(Boolean);
if (held.length) hits = new Set(held);
window.setHits = ids => { hits = new Set(ids); };

document.getElementById('hit').onclick = () => {
  hits = new Set();
  for (let i = 0; i < 5; i++) hits.add(pegs[(Math.random() * pegs.length) | 0].id);
  setTimeout(() => { hits = new Set(); }, 130);
};
document.getElementById('shot').onclick = () => {
  ball.x = 60 + Math.random() * 280; ball.y = 40;
  ball.vx = (Math.random() - 0.5) * 160; ball.vy = 190;
};

const ui = id => document.getElementById(id);
let last = performance.now(), acc = 0, frames = 0;

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  acc += dt; frames++;
  if (acc > 0.5) { ui('fps').textContent = `${(frames / acc).toFixed(0)} fps`; acc = 0; frames = 0; }

  if (ui('anim').checked) {
    ball.vy += 260 * dt;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    if (ball.x < 20 || ball.x > W - 20) ball.vx *= -1;
    if (ball.y > H - 20) { ball.y = 40; ball.vy = 120; }
    // crude peg contact so hits (and their light) actually happen in motion
    const struck = new Set();
    for (const p of pegs) {
      const r = (p.shape === 'brick' ? 26 : PHYSICS_CONFIG.pegRadius * 1.3) + ball.radius;
      if ((p.x - ball.x) ** 2 + (p.y - ball.y) ** 2 < r * r) {
        struck.add(p.id);
        const nx = ball.x - p.x, ny = ball.y - p.y;
        const len = Math.hypot(nx, ny) || 1;
        const dot = (ball.vx * nx + ball.vy * ny) / len;
        if (dot < 0) { ball.vx -= 2 * dot * nx / len; ball.vy -= 2 * dot * ny / len; }
      }
    }
    if (struck.size) hits = struck;
    else if (hits.size && Math.random() < 0.25) hits = new Set();
  }

  const lights = [];
  if (ui('balllight').checked) {
    lights.push({ x: ball.x, y: ball.y, radius: ball.radius, shape: 'ball',
      color: [0.62, 0.90, 1.0], intensity: 2.6 });
  }

  const skyScale = +ui('sky').value;
  try {
    renderer.render(pegs, hits, {
      width: W, height: H,
      timeSeconds: now / 1000,
      exposure: +ui('exposure').value,
      bloom: +ui('bloom').value,
      bounce: +ui('bounce').value,
      domeIntensity: +ui('dome').value,
      keyElevation: +ui('keyelev').value,
      lightElevation: +ui('elev').value,
      skyTop: [0.052 * skyScale, 0.128 * skyScale, 0.205 * skyScale],
      skyBottom: [0.012 * skyScale, 0.028 * skyScale, 0.048 * skyScale],
      lights
    });
  } catch (e) {
    err.textContent = String(e && e.stack || e);
    return;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.addEventListener('error', e => { err.textContent = String(e.message); });
</script>
</body>
</html>
