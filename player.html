<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d1117">
  <title>Peggle</title>
  <script>
    (() => {
      try {
        const params = new URLSearchParams(location.search);
        if (location.hash || params.get('campaign') || params.get('level') || params.get('levels')) return;

        const ttl = 60 * 1000;
        const now = Date.now();
        const primaryName = localStorage.getItem('config:primaryCampaign');
        const primaryTs = parseInt(localStorage.getItem('config_ts:primaryCampaign') || '0', 10);
        const primaryFresh = !!(primaryName && (now - primaryTs) < ttl);
        const campaignFresh = primaryFresh
          && !!localStorage.getItem('campaign:' + primaryName)
          && (now - parseInt(localStorage.getItem('campaign_ts:' + primaryName) || '0', 10)) < ttl;
        if (campaignFresh) return;

        window.__PEGGLE_PRIMARY_CAMPAIGN_PRELOAD__ = fetch('/api/campaigns?primary=true&resolve=true', {
          credentials: 'same-origin'
        }).then(res => res.ok ? res.json() : null).catch(() => null);
      } catch (_) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/visual-layout.css">
  <style>
    /* Player overrides — body is the sole layout root (no .app wrapper) */
    body { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; }
    .visual-viewport { width: 100%; height: 100%; }
    .canvas-container { position: relative; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="canvasContainer" class="canvas-container">
    <canvas id="gameCanvas"></canvas>
  </div>
  <script type="module" src="dist/player-bootstrap.js"></script>
</body>
</html>
