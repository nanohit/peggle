<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Peggle</title>
  <script>
    (() => {
      try {
        window.__PEGGLE_BOOT_STARTED_AT__ = performance.now();
        const params = new URLSearchParams(location.search);
        if (location.hash || params.get('campaign') || params.get('level') || params.get('levels')) return;

        const ttl = 60 * 1000;
        const now = Date.now();
        const primaryName = localStorage.getItem('config:primaryCampaign');
        const primaryTs = parseInt(localStorage.getItem('config_ts:primaryCampaign') || '0', 10);
        const primaryFresh = !!(primaryName && (now - primaryTs) < ttl);
        const campaignFresh = primaryFresh
          && !!localStorage.getItem('campaign:' + primaryName)
          && (now - parseInt(localStorage.getItem('campaign_ts:' + primaryName) || '0', 10)) < ttl;
        if (campaignFresh) return;

        window.__PEGGLE_PRIMARY_CAMPAIGN_PRELOAD__ = fetch('/data/player/primary.initial.json', {
          credentials: 'same-origin'
        }).then(res => res.ok ? res.json() : null).catch(() => null);
      } catch (_) {}
    })();
  </script>
  <link rel="modulepreload" href="dist/player-bootstrap.js">
  <link rel="preload" href="visuals/backgrounds/background1.webp" as="image" fetchpriority="high">
  <link rel="preload" href="visuals/assets_webtp/character.webp" as="image">
  <link rel="preload" href="visuals/assets_webtp/top.webp" as="image">
  <link rel="preload" href="visuals/bucket.webp" as="image">
  <link rel="preload" href="visuals/loadscreen_logo.webp" as="image">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/visual-layout.css">
  <style>
    /* Player overrides — body is the sole layout root (no .app wrapper) */
    html, body { background: #000; }
    body { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; }
    .visual-viewport { width: 100%; height: 100%; background: #000; }
    .canvas-container { position: relative; }
    canvas { display: block; }
    #bootCover {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      transition: opacity 180ms ease;
    }
    .boot-loader {
      position: relative;
      width: 108px;
      height: 108px;
    }
    .boot-logo {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 54px;
      height: auto;
      transform: translate(-50%, -50%);
      opacity: 0.96;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.55));
    }
    .boot-orbit {
      position: absolute;
      inset: 0;
      animation: bootOrbit 1.08s linear infinite;
    }
    .boot-ball {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 5px rgba(255, 255, 255, 0.52);
      transform:
        translate(-50%, -50%)
        rotate(calc(var(--i) * 36deg))
        translateY(-48px);
      opacity: var(--o, 0.88);
    }
    html.player-ready #bootCover {
      opacity: 0;
      pointer-events: none;
    }
    @keyframes bootOrbit {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="bootCover" aria-live="polite" aria-label="Loading Peggle">
    <div class="boot-loader" aria-hidden="true">
      <img class="boot-logo" src="visuals/loadscreen_logo.webp" alt="" draggable="false">
      <div class="boot-orbit">
        <span class="boot-ball" style="--i: 0; --o: 0.42"></span>
        <span class="boot-ball" style="--i: 1; --o: 0.48"></span>
        <span class="boot-ball" style="--i: 2; --o: 0.54"></span>
        <span class="boot-ball" style="--i: 3; --o: 0.60"></span>
        <span class="boot-ball" style="--i: 4; --o: 0.66"></span>
        <span class="boot-ball" style="--i: 5; --o: 0.72"></span>
        <span class="boot-ball" style="--i: 6; --o: 0.78"></span>
        <span class="boot-ball" style="--i: 7; --o: 0.84"></span>
        <span class="boot-ball" style="--i: 8; --o: 0.90"></span>
        <span class="boot-ball" style="--i: 9; --o: 0.96"></span>
      </div>
    </div>
  </div>
  <div id="canvasContainer" class="canvas-container">
    <canvas id="gameCanvas"></canvas>
  </div>
  <script type="module" src="dist/player-bootstrap.js"></script>
</body>
</html>
