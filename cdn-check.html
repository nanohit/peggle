<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка доступности CDN — alea.sh</title>
<style>
  body { margin: 0; padding: 20px 16px 48px; background: #101319; color: #e8ecf3;
         font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #8a93a6; font-size: 13px; margin-bottom: 20px; }
  .test { background: #1a1f2a; border: 1px solid #2a3245; border-radius: 10px;
          padding: 12px 14px; margin-bottom: 10px; }
  .test-head { display: flex; align-items: center; gap: 10px; }
  .badge { flex: none; width: 74px; text-align: center; border-radius: 6px;
           font-size: 12px; font-weight: 600; padding: 3px 0; }
  .badge.wait { background: #2a3245; color: #8a93a6; }
  .badge.ok   { background: #10391f; color: #4ade80; }
  .badge.fail { background: #431a1a; color: #f87171; }
  .test-name { font-weight: 600; }
  .test-detail { color: #8a93a6; font-size: 13px; margin: 6px 0 0 84px; word-break: break-all; }
  .verdict { margin-top: 20px; padding: 14px 16px; border-radius: 10px; font-weight: 600;
             background: #2a3245; }
  .verdict.ok   { background: #10391f; color: #4ade80; }
  .verdict.warn { background: #3f3013; color: #fbbf24; }
  .verdict.fail { background: #431a1a; color: #f87171; }
  button { margin-top: 16px; background: #2563eb; color: #fff; border: 0; border-radius: 8px;
           padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
  button:active { opacity: .8; }
</style>
</head>
<body>
<main>
  <h1>Проверка доступности игровых ассетов</h1>
  <div class="sub" id="meta"></div>
  <div id="tests"></div>
  <div class="verdict" id="verdict">Выполняются проверки…</div>
  <button id="copyBtn" hidden>Скопировать результаты</button>
</main>
<script>
(function () {
  var CDN_HOST = 'https://alea-assets.b-cdn.net';
  var ALIAS_HOST = 'https://cdn.alea.sh';
  var ASSET_PATH = '/level-assets/backgrounds/2256a3495085cf72e50c41db4e4749ebb87f9f64c9fae930a67b878cee005a45.webp';
  var API_PATH = '/api/assets?key=level-assets/backgrounds/2256a3495085cf72e50c41db4e4749ebb87f9f64c9fae930a67b878cee005a45.webp';
  var TIMEOUT_MS = 10000;

  var TESTS = [
    { id: 'api',   name: 'Резервный канал (alea.sh /api/assets)' },
    { id: 'reach', name: 'CDN отвечает (b-cdn.net, соединение)' },
    { id: 'fetch', name: 'CDN отдаёт картинку (fetch + CORS)' },
    { id: 'img',   name: 'CDN картинка через <img> (как в игре)' },
    { id: 'alias', name: 'Обходной CDN-домен (cdn.alea.sh)' }
  ];

  var results = {};
  var testsEl = document.getElementById('tests');
  TESTS.forEach(function (t) {
    var div = document.createElement('div');
    div.className = 'test';
    div.innerHTML = '<div class="test-head">' +
      '<span class="badge wait" id="badge-' + t.id + '">…</span>' +
      '<span class="test-name">' + t.name + '</span></div>' +
      '<div class="test-detail" id="detail-' + t.id + '"></div>';
    testsEl.appendChild(div);
  });

  document.getElementById('meta').textContent =
    new Date().toISOString() + ' · ' + navigator.userAgent;

  function report(id, ok, detail) {
    results[id] = { ok: ok, detail: detail };
    var badge = document.getElementById('badge-' + id);
    badge.className = 'badge ' + (ok ? 'ok' : 'fail');
    badge.textContent = ok ? 'OK' : 'ОШИБКА';
    document.getElementById('detail-' + id).textContent = detail;
    if (Object.keys(results).length === TESTS.length) finish();
  }

  function timedFetch(url, opts) {
    var started = performance.now();
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, TIMEOUT_MS);
    opts = opts || {};
    opts.signal = controller.signal;
    opts.cache = 'no-store';
    return fetch(url, opts).then(function (res) {
      clearTimeout(timer);
      return { res: res, ms: Math.round(performance.now() - started) };
    }, function (err) {
      clearTimeout(timer);
      var ms = Math.round(performance.now() - started);
      var reason = (err && err.name === 'AbortError')
        ? 'таймаут ' + TIMEOUT_MS + ' мс (соединение висит — похоже на блокировку)'
        : 'сетевая ошибка за ' + ms + ' мс (' + err + ')';
      throw new Error(reason);
    });
  }

  timedFetch(API_PATH).then(function (r) {
    return r.res.arrayBuffer().then(function (buf) {
      report('api', r.res.ok, 'HTTP ' + r.res.status + ' · ' + buf.byteLength + ' байт · ' + r.ms + ' мс');
    });
  }).catch(function (e) { report('api', false, e.message); });

  timedFetch(CDN_HOST + '/', { mode: 'no-cors' }).then(function (r) {
    report('reach', true, 'сервер ответил · ' + r.ms + ' мс');
  }).catch(function (e) { report('reach', false, e.message); });

  timedFetch(CDN_HOST + ASSET_PATH).then(function (r) {
    return r.res.arrayBuffer().then(function (buf) {
      report('fetch', r.res.ok, 'HTTP ' + r.res.status + ' · ' + buf.byteLength + ' байт · ' + r.ms + ' мс');
    });
  }).catch(function (e) { report('fetch', false, e.message); });

  timedFetch(ALIAS_HOST + ASSET_PATH).then(function (r) {
    return r.res.arrayBuffer().then(function (buf) {
      report('alias', r.res.ok, 'HTTP ' + r.res.status + ' · ' + buf.byteLength + ' байт · ' + r.ms + ' мс');
    });
  }).catch(function (e) { report('alias', false, e.message); });

  (function () {
    var started = performance.now();
    var done = false;
    var img = new Image();
    img.crossOrigin = 'anonymous';
    var timer = setTimeout(function () {
      if (done) return; done = true;
      report('img', false, 'таймаут ' + TIMEOUT_MS + ' мс (соединение висит — похоже на блокировку)');
    }, TIMEOUT_MS);
    img.onload = function () {
      if (done) return; done = true; clearTimeout(timer);
      report('img', true, img.naturalWidth + '×' + img.naturalHeight + ' · ' + Math.round(performance.now() - started) + ' мс');
    };
    img.onerror = function () {
      if (done) return; done = true; clearTimeout(timer);
      report('img', false, 'ошибка загрузки за ' + Math.round(performance.now() - started) + ' мс');
    };
    img.src = CDN_HOST + ASSET_PATH + '?cb=' + Date.now();
  })();

  function finish() {
    var v = document.getElementById('verdict');
    var cdnOk = results.reach.ok && results.fetch.ok && results.img.ok;
    if (cdnOk && results.api.ok) {
      v.className = 'verdict ok';
      v.textContent = 'Всё доступно: и CDN, и резервный канал. Проблем с этого подключения нет.';
    } else if (!cdnOk && results.alias.ok) {
      v.className = 'verdict ok';
      v.textContent = 'b-cdn.net заблокирован, но обходной домен cdn.alea.sh работает — игра будет грузиться через него на полной скорости CDN.';
    } else if (!cdnOk && results.api.ok) {
      v.className = 'verdict warn';
      v.textContent = 'CDN (b-cdn.net) недоступен с этого подключения, но резервный канал через alea.sh работает — игра должна грузиться через него.';
    } else if (cdnOk && !results.api.ok) {
      v.className = 'verdict warn';
      v.textContent = 'CDN работает, но резервный канал alea.sh /api/assets не отвечает.';
    } else {
      v.className = 'verdict fail';
      v.textContent = 'Недоступны и CDN, и резервный канал — проблема шире, чем блокировка b-cdn.net.';
    }
    var btn = document.getElementById('copyBtn');
    btn.hidden = false;
    btn.onclick = function () {
      var payload = JSON.stringify({
        when: new Date().toISOString(),
        userAgent: navigator.userAgent,
        results: results
      }, null, 2);
      (navigator.clipboard ? navigator.clipboard.writeText(payload) : Promise.reject())
        .then(function () { btn.textContent = 'Скопировано!'; },
              function () { prompt('Скопируйте вручную:', payload); });
    };
  }
})();
</script>
</body>
</html>
